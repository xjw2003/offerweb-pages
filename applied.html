<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>已投递岗位</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./applied-extra.css" />
</head>
<body>
  <main class="app-shell">
    <header class="applied-page-header">
      <div>
        <h1>已投递岗位</h1>
        <p>查看投递详情，并记录岗位是否已有结果</p>
      </div>
      <div class="applied-header-actions">
        <a class="secondary-button" href="./index.html">返回全部岗位</a>
        <span id="appliedUser" class="applied-user"></span>
      </div>
    </header>

    <section class="applied-toolbar">
      <input id="appliedSearch" type="search" placeholder="搜索公司、岗位、地点" />
      <select id="resultFilter" aria-label="按结果状态筛选">
        <option value="">全部结果状态</option>
        <option value="has_result">有结果</option>
        <option value="no_result">无结果</option>
      </select>
      <select id="appliedSort" aria-label="排序方式">
        <option value="updated_desc">最近修改</option>
        <option value="job_update_desc">岗位最近更新</option>
        <option value="name_asc">公司名称</option>
      </select>
      <span id="appliedCount" class="status-label status-applied">0 / 0 个已投递</span>
    </section>

    <section class="applied-layout">
      <aside class="applied-panel">
        <div class="applied-panel-head"><strong>投递列表</strong></div>
        <div id="resultList" class="result-list"></div>
      </aside>
      <article id="detailPanel" class="detail-panel">
        <div class="empty-state">选择岗位查看详情</div>
      </article>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./applied.js"></script>
</body>
</html>
