<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2027届岗位筛选</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="all">
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="title-row">
            <div>
              <h1>2027届岗位筛选</h1>
              <p id="sourceLabel">正在读取岗位数据</p>
            </div>
            <nav class="page-nav" aria-label="页面导航">
              <a class="nav-link active" href="./index.html">全部岗位</a>
              <a class="nav-link" href="./applied.html">已投递岗位</a>
            </nav>
          </div>

          <div class="summary-strip" aria-label="岗位统计">
            <div>
              <span id="totalCount">0</span>
              <small>全部岗位</small>
            </div>
            <div>
              <span id="filteredCount">0</span>
              <small>当前结果</small>
            </div>
            <div class="summary-gold">
              <span id="appliedCount">0</span>
              <small>已投递</small>
            </div>
            <div>
              <span id="lastUpdateCount">-</span>
              <small>上次更新条数</small>
            </div>
            <div class="summary-time">
              <span id="lastUpdateTime">-</span>
              <small>上次更新时间</small>
            </div>
          </div>
        </div>

        <section class="auth-card" aria-label="账号登录">
          <div id="signedOutPanel" class="auth-form">
            <strong>同步投递状态</strong>
            <input id="emailInput" type="email" placeholder="邮箱" autocomplete="username" />
            <input id="passwordInput" type="password" placeholder="密码" autocomplete="current-password" />
            <button id="loginButton" class="primary-button" type="button">登录</button>
          </div>
          <div id="signedInPanel" class="auth-user" hidden>
            <span>当前账号</span>
            <strong id="userEmail">-</strong>
            <button id="logoutButton" type="button">退出登录</button>
          </div>
          <p id="authMessage" class="auth-message" aria-live="polite"></p>
        </section>
      </header>

      <section class="controls" aria-label="筛选条件">
        <label class="field search-field">
          <span>关键词</span>
          <input id="keywordInput" type="search" placeholder="公司、岗位、城市、行业" autocomplete="off" />
        </label>
        <label class="field">
          <span>行业</span>
          <select id="industrySelect">
            <option value="">全部行业</option>
          </select>
        </label>
        <label class="field">
          <span>性质</span>
          <select id="typeSelect">
            <option value="">全部性质</option>
          </select>
        </label>
        <label class="field">
          <span>地点</span>
          <input id="locationInput" type="text" placeholder="北京,上海,-全国" autocomplete="off" />
        </label>
        <label class="field">
          <span>招聘类型</span>
          <select id="recruitmentSelect">
            <option value="">全部类型</option>
          </select>
        </label>
        <label class="field">
          <span>目标届别</span>
          <select id="targetSelect">
            <option value="">全部届别</option>
          </select>
        </label>
        <div class="actions">
          <button id="resetButton" type="button" title="清空筛选">
            <span aria-hidden="true">↺</span>
            重置
          </button>
        </div>
      </section>

      <section class="content-grid">
        <aside class="list-panel">
          <div class="list-head">
            <strong>岗位列表</strong>
            <select id="sortSelect" title="排序">
              <option value="update_desc">更新时间新到旧</option>
              <option value="update_asc">更新时间旧到新</option>
              <option value="name_asc">公司名称 A-Z</option>
              <option value="deadline_asc">截止时间近到远</option>
            </select>
          </div>
          <div id="resultList" class="result-list" aria-live="polite"></div>
        </aside>

        <article id="detailPanel" class="detail-panel">
          <div class="empty-state">选择左侧岗位查看详情</div>
        </article>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
